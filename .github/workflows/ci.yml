name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # components 不能省：dtolnay/rust-toolchain 默认按 minimal profile 安装，
      # 不含 rustfmt，漏了会报 "'cargo-rustfmt' is not installed"。
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Cargo fmt check
        run: cargo +nightly fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # components: clippy 同理 —— minimal profile 不含 clippy。
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # --workspace：根包与 cloud-core-queue 两个包都要过。
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # ⚠️ 只跑不需要 NATS 的测试。
      #
      # tests/integration.rs 与 tests/reliability.rs 需要一个**预置好资源**的
      # JetStream（因为本库刻意不创建基础设施），未设 CCQ_NATS_URL 时它们
      # 全部安静跳过 —— 所以这里能绿。
      #
      # ⚠️ 这是真实的覆盖缺口：端到端与 §9.2 可靠性回归**没有在 CI 里执行**，
      # 只能本地手工跑：
      #   nats-server -js -p 4222 -sd /tmp/ccq
      #   nats kv add <queue>-meta --history 1 --replicas 1
      #   nats stream add <queue>         --subjects '<queue>.tasks.>'   --retention workq  --storage file --replicas 1
      #   nats stream add <queue>-results --subjects '<queue>.results.>' --retention limits --storage file --replicas 1
      #   CCQ_NATS_URL=nats://127.0.0.1:4222 cargo test --workspace -- --test-threads=1
      - name: Cargo test
        run: cargo test --workspace

  # 检出声明了却没用到的依赖。
  #
  # 本仓的依赖面有个具体风险：根包必须保持「纯协议类型」，AGENTS.md 明令
  # 不得引入 async-nats / tokio 之类运行时依赖。有人若在根包
  # Cargo.toml 里加了又忘了从 lib.rs 删掉，编译与测试都照样绿，
  # 只有 wasm-root job 会在更后面、也更隐晦的地方报警 —— machete 直接
  # 指出「声明未用」。
  #
  # 版本锁 0.9（本地验证过的版本），避免上游发新版时 CI 行为突变。
  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      # ⚠️ 版本必须走 with.tool，不能写进 uses 的 ref：taiki-e/install-action
      # 的 per-tool tag 只有 `cargo-machete`，不存在 `cargo-machete@0.9`。
      # ref 写错时 GitHub 在**解析阶段**就判定 workflow 文件非法，整条流水线
      # 一个 job 都不跑，页面上只显示 "This run likely failed because of a
      # workflow file issue"。0.9.2 是本地验证过的版本。
      - uses: taiki-e/install-action@cargo-machete
        with:
          tool: cargo-machete@0.9.2
      # --with-metadata：按 cargo metadata 解析依赖名，规避重命名依赖
      # （xml-rs → xml 之类）造成的误报。实测本仓 0 findings。
      #
      # ⚠️ 额外守一道：cargo-machete 0.9 在 `cargo metadata` **失败时仍返回
      # exit 0**，只把 "error when handling ..." 打到 stderr。实测：注入一个
      # 解析不了的依赖版本后，它一边刷错误一边报 "didn't find any unused
      # dependencies" 并 exit 0 —— 静默放行。所以显式把这行捞出来判失败，
      # 否则这个 job 在 workspace 解析出错时会假装通过。
      - name: Detect unused dependencies
        run: |
          set -o pipefail
          output=$(cargo machete --with-metadata 2>&1) || {
            echo "$output"
            exit 1
          }
          if echo "$output" | grep -q "error when handling"; then
            echo "$output"
            echo "::error::cargo metadata 解析失败，machete 结论不可信"
            exit 1
          fi
          echo "$output"

  # 根包必须保持 WASM 可编译。
  #
  # tokengateway 仍是 WASM 组件，依赖的是**根包**（不是 cloud-core-queue）。
  # AGENTS.md 的硬约束是「根包不得引入 async-nats / tokio 等运行时依赖」——
  # 一旦有人顺手往根包加一条，本 CI 全绿，而故障点落在另一个仓、很难往回溯。
  # 本 job 是那道护栏，且不依赖任何外部仓库。
  wasm-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      # 只编根包：cloud-core-queue 带 async-nats，本就不该进 WASM。
      - name: Build root package for wasm32-wasip2
        run: cargo build -p cloud-core --target wasm32-wasip2